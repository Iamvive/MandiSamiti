version: '3.8'

services:
  api:
    build: .
    container_name: mandisamiti_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mandi_user:mandi_pass@db:5432/mandisamiti
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-this-to-a-super-secret-jwt-key-in-production-vps
      - OTP_MOCK_MODE=False
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: mandisamiti_db
    restart: always
    environment:
      - POSTGRES_USER=mandi_user
      - POSTGRES_PASSWORD=mandi_pass
      - POSTGRES_DB=mandisamiti
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mandisamiti_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
