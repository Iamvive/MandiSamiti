version: '3.8'

services:
  api:
    build: .
    container_name: mandisamiti_prod_api
    restart: always
    ports:
      - "127.0.0.1:8050:8000"
    env_file: .env.prod
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: mandisamiti_prod_db
    restart: always
    env_file: .env.prod
    volumes:
      - mandisamiti_prod_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mandisamiti_prod_redis
    restart: always
    volumes:
      - mandisamiti_prod_redis_data:/data

volumes:
  mandisamiti_prod_postgres_data:
  mandisamiti_prod_redis_data:
