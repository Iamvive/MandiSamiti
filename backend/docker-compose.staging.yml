version: '3.8'

services:
  api:
    build: .
    container_name: mandisamiti_staging_api
    restart: always
    ports:
      - "8060:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mandi_staging_user:${POSTGRES_PASSWORD}@db:5432/mandisamiti_staging
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - OTP_STATIC_ENABLED=true
      - OTP_STATIC_CODE=${OTP_STATIC_CODE}
    depends_on:
      - db
      - redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"


  db:
    image: postgres:16-alpine
    container_name: mandisamiti_staging_db
    restart: always
    environment:
      - POSTGRES_USER=mandi_staging_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=mandisamiti_staging
    volumes:
      - mandisamiti_staging_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mandisamiti_staging_redis
    restart: always
    volumes:
      - mandisamiti_staging_redis_data:/data

volumes:
  mandisamiti_staging_postgres_data:
  mandisamiti_staging_redis_data:
