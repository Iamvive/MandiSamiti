version: '3.8'

services:
  api:
    build: .
    container_name: mandisamiti_prod_api
    restart: always
    ports:
      - "8050:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mandi_prod_user:mandi_prod_secret_2026@db:5432/mandisamiti_prod
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=mandisamiti-production-jwt-secure-key-2026
      - OTP_MOCK_MODE=False
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: mandisamiti_prod_db
    restart: always
    environment:
      - POSTGRES_USER=mandi_prod_user
      - POSTGRES_PASSWORD=mandi_prod_secret_2026
      - POSTGRES_DB=mandisamiti_prod
    volumes:
      - mandisamiti_prod_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mandisamiti_prod_redis
    restart: always
    volumes:
      - mandisamiti_prod_redis_data:/data

volumes:
  mandisamiti_prod_postgres_data:
  mandisamiti_prod_redis_data:
