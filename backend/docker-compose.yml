version: '3.8'

services:
  api:
    build: .
    container_name: mandisamiti_api
    restart: always
    ports:
      - "8050:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://mandi_user:mandi_secure_pass_2026@db:5432/mandisamiti
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=mandisamiti-super-secret-production-vps-jwt-key-2026
      - OTP_MOCK_MODE=True
    depends_on:
      - db
      - redis

  db:
    image: postgres:16-alpine
    container_name: mandisamiti_db
    restart: always
    environment:
      - POSTGRES_USER=mandi_user
      - POSTGRES_PASSWORD=mandi_secure_pass_2026
      - POSTGRES_DB=mandisamiti
    volumes:
      - mandisamiti_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mandisamiti_redis
    restart: always
    volumes:
      - mandisamiti_redis_data:/data

volumes:
  mandisamiti_postgres_data:
  mandisamiti_redis_data:
